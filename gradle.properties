# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.

# ============================================================================
# Gradle build configuration for the gnirehtet Android client.
#
# Philosophy, borrowed from the djot "JVM Arguments" page:
#   "If some random set of flag soup were better, it'd be the default."
#
# This file deliberately contains only flags that Gradle and Android Studio
# officially recommend, plus the one rule that actually matters for build
# performance: -Xms must match -Xmx.
#
# DO NOT add any of the following (they are actively harmful or obsolete):
#   -XX:+UnlockExperimentalVMOptions   breaks compatibility guarantees
#   -XX:+UseZGC                         interactive/game workload, not batch build
#   -XX:+UseConcMarkSweepGC             removed in JDK 14
#   -XX:+UseParNewGC                    removed in JDK 14
#   -XX:+UseFastUnorderedTimeStamps     breaks monotonic timestamps, can corrupt cache
#   -XX:+DisableExplicitGC              breaks Android's OOM handling in some paths
# ============================================================================

# ----------------------------------------------------------------------------
# Gradle daemon JVM args
# ----------------------------------------------------------------------------
# -Xms4g -Xmx4g     matching sizes avoid allocation/GC thrashing. The single
#                   most impactful flag in this file. Lower to 2g on machines
#                   with <8 GB RAM; raise to 6g only if builds actually OOM.
#                   Never set them separately unless memory-constrained.
# -XX:+UseParallelGC  Android Studio's recommended collector for the Gradle
#                   daemon. Batch workload, not interactive — ZGC is wrong here.
# -XX:+HeapDumpOnOutOfMemoryError
#                   cheap insurance. Dumps heap to disk on OOM so the failure
#                   is debuggable instead of just a stack trace.
# -Dfile.encoding=UTF-8
#                   required for reproducible builds across Windows/Linux/macOS.
#                   Without it, source files with non-ASCII bytes compile
#                   differently depending on the host locale.
org.gradle.jvmargs=-Xms4g -Xmx4g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ----------------------------------------------------------------------------
# Kotlin daemon
# ----------------------------------------------------------------------------
# Only relevant if the project uses Kotlin. The Kotlin compiler spawns its own
# JVM; if its flags differ from the Gradle daemon's, you get two JVMs competing
# for the same memory. Keeping them aligned avoids that. Remove this line if
# the project is Java-only (the upstream gnirehtet client is).
kotlin.daemon.jvmargs=-Xms1g -Xmx1g -XX:+UseParallelGC

# ----------------------------------------------------------------------------
# Build execution
# ----------------------------------------------------------------------------
# Run independent module tasks in parallel. Safe as long as modules don't
# share output directories — which is the case here.
org.gradle.parallel=true

# Reuse task outputs across builds when inputs haven't changed. First build
# is unaffected; subsequent builds are noticeably faster.
org.gradle.caching=true

# Serialize the task graph into a reusable snapshot. AGP 8.x supports this
# since 8.0. If a plugin misbehaves, the error message will say so and you
# can flip this to false temporarily to diagnose.
org.gradle.configuration-cache=true

# ----------------------------------------------------------------------------
# Android
# ----------------------------------------------------------------------------
# AndroidX is required by every modern AGP project. The old support library
# is dead and incompatible with AGP 8+.
android.useAndroidX=true

# Non-transitive R classes: each module only sees its own R, not dependencies'.
# Smaller R jars, faster incremental builds. Default true in AGP 8+ but kept
# explicit so the intent is documented.
android.nonTransitiveRClass=true

# ----------------------------------------------------------------------------
# NDK
# ----------------------------------------------------------------------------
# The NDK r26+ dropped support for API 19 and 20 (KitKat, Android 4.4).
# The legacy flavor targets minSdk 19, which triggers:
#
#   [CXX1110] Platform version 19 is unsupported by this NDK.
#
# This is a blanket suppression that applies to all flavors. The modern
# flavor (minSdk 21) does not trigger the error anyway. The legacy flavor
# triggers it, but the only native code is a 30-line fcntl wrapper that
# works identically on every Linux kernel since 2.6.
#
# If the JNI code grows to use platform-specific APIs that actually differ
# between API 19 and API 21, replace this suppression with a per-flavor
# NDK configuration using android.experimentalProperties.
android.ndk.suppressMinSdkVersionError=21

# ----------------------------------------------------------------------------
# Kotlin
# ----------------------------------------------------------------------------
# Official Kotlin code style. Harmless if the project is Java-only.
kotlin.code.style=official

# NOTE: a previous version of this file contained a hardcoded
# `org.gradle.java.installations.paths=/usr/lib/jvm/java-26-openjdk-amd64`
# line. That path only exists on a specific development machine and
# must NOT be present in CI: it confuses Gradle's JDK detection and
# breaks the release workflow. If you need it locally, put it in
# ~/.gradle/gradle.properties instead of the repo.
