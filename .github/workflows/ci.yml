name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check
        run: cargo check --manifest-path relay-rust/Cargo.toml --bin gnirehtet

      - name: Clippy
        run: cargo clippy --manifest-path relay-rust/Cargo.toml --bin gnirehtet -- -D warnings

      - name: Test
        run: cargo test --manifest-path relay-rust/Cargo.toml

  build-apk:
    # Builds the modern flavor only. The legacy flavor is built in the
    # build-legacy job below. Pinning to :app:assembleModernDebug is
    # required because flavorDimensions makes the generic
    # :app:assembleDebug target expand to both flavors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (modern)
        run: ./gradlew :app:assembleModernDebug

  build-legacy:
    # Builds the legacy flavor (minSdk 19, Android 4.4). Non-blocking:
    # failures here do not fail the workflow. The job is kept separate
    # because the legacy flavor requires NDK and CMake packages that the
    # modern job does not need.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (legacy)
        run: ./gradlew :app:assembleLegacyDebug
